# Requires QF_API_KEYS in your environment or a .env file (see .env.example).
services:
  queueforge:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # bind to localhost; put a TLS reverse proxy in front for remote access
    environment:
      NODE_ENV: production
      QF_API_KEYS: ${QF_API_KEYS:?set QF_API_KEYS (see .env.example)}
      QF_LOG_LEVEL: ${QF_LOG_LEVEL:-info}
    volumes:
      - queueforge-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  queueforge-data:
